name: Release

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish to GitHub Releases'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build (release)
      shell: bash
      run: |
        cd paint
        ../base/make --compile
        echo "--- build/out contents:"
        ls -la build/out

    - name: Package
      shell: bash
      run: |
        VER="${GITHUB_REF_NAME:-$(git describe --tags --always --dirty)}"
        mkdir -p dist
        # Layout: ArmorPaint/ contains the exe + data dir, matching the
        # runtime's exe-relative asset lookup.
        mkdir -p "dist/ArmorPaint"
        cp paint/build/out/ArmorPaint.exe dist/ArmorPaint/
        cp -r paint/build/out/data dist/ArmorPaint/data
        cd dist
        7z a "ArmorPaint-${VER}-windows-x64.zip" ArmorPaint > /dev/null
        sha256sum "ArmorPaint-${VER}-windows-x64.zip" > "ArmorPaint-${VER}-windows-x64.zip.sha256"
        ls -la

    - name: Upload artifact (always)
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-windows
        path: dist/*
        if-no-files-found: error

    - name: Publish release (on tag, or explicit request)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/ArmorPaint-*-windows-x64.zip
          dist/ArmorPaint-*-windows-x64.zip.sha256
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
